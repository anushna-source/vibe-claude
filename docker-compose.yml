# Local PostgreSQL for development and tests.
# Start: pnpm db:up   Stop: pnpm db:down   Wipe data: pnpm db:reset
name: inventory

services:
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      # Local development defaults only. Never reuse these anywhere real.
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume. Creates inventory_test.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
